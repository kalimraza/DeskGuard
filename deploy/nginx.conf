# /etc/nginx/sites-available/deskguard
# Copy to: /etc/nginx/sites-available/deskguard
# Then: ln -sf /etc/nginx/sites-available/deskguard /etc/nginx/sites-enabled/
# Then: nginx -t && systemctl reload nginx

# Rate limiting zones
# Agents upload every hour — 10 req/min per IP is more than enough
limit_req_zone  $binary_remote_addr zone=agents:10m rate=10r/m;
# Admin CLI calls are infrequent
limit_req_zone  $binary_remote_addr zone=admin:10m  rate=30r/m;

server {
    listen 80;
    server_name monitor.yourdomain.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name monitor.yourdomain.com;

    # ── SSL (managed by Certbot — do not edit these manually) ────────────────
    ssl_certificate     /etc/letsencrypt/live/monitor.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── SSL hardening ─────────────────────────────────────────────────────────
    ssl_protocols       TLSv1.2 TLSv1.3;     # disable old TLS versions
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           "DENY"              always;
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header X-XSS-Protection          "1; mode=block"     always;
    add_header Referrer-Policy           "no-referrer"       always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Hide server version
    server_tokens off;

    # ── Request limits ────────────────────────────────────────────────────────
    # 100MB to allow screenshot batches (hourly upload can be large)
    client_max_body_size    100M;
    client_body_timeout     60s;
    client_header_timeout   15s;
    send_timeout            60s;
    keepalive_timeout       30s;

    # ── Agent endpoints (rate limited) ────────────────────────────────────────
    location /api/ {
        limit_req zone=agents burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Hide upstream server info
        proxy_hide_header  X-Powered-By;
        proxy_hide_header  Server;
    }

    # ── Admin endpoints (stricter rate limit) ─────────────────────────────────
    location /admin/ {
        limit_req zone=admin burst=10 nodelay;

        # Optional: restrict admin to your office/home IP only
        # allow 203.0.113.10;    # your IP
        # deny  all;

        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Block everything else ─────────────────────────────────────────────────
    location / {
        return 404;
    }

    # ── Block common attack paths ─────────────────────────────────────────────
    location ~* \.(php|asp|aspx|jsp|cgi)$ { return 444; }
    location ~* /(wp-admin|phpmyadmin|.env|.git) { return 444; }
}
